<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון שכר, חיסכון וקצבה</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    
    <link rel="icon" type="image/jpeg" href="Image1.jpg">
    <link rel="apple-touch-icon" href="Image1.jpg">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #f2f2f7; 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .card { 
            background: white; padding: 20px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; max-width: 480px; margin-bottom: 20px; 
        }

        h2 { text-align: center; font-size: 1.4rem; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f2f2f7; }
        .salary-title { color: #007aff; }
        .savings-title { color: #5856d6; }
        .pension-title { color: #2c3e50; }

        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; color: #3a3a3c; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; 
            font-size: 16px; background: #fafafa; font-weight: bold; text-align: center; 
        }

        /* עיצוב כפתורים כתום אחיד */
        .btn-transfer, .btn-pension-transfer { 
            width: 100%; padding: 10px; background: #ff9500; color: white; 
            border: none; border-radius: 10px; font-weight: bold; font-size: 0.9rem; 
            margin-top: 15px; cursor: pointer; 
        }

        /* עיצוב תיבות סיכום סגולות מאוחדות */
        .summary-box { 
            background: #5856d6; color: white; margin-top: 20px; 
            padding: 18px; border-radius: 18px; 
        }
        
        .summary-title { text-align: center; font-size: 0.9rem; margin-bottom: 12px; font-weight: bold; opacity: 0.9; }
        .s-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .total-highlight { 
            border-top: 1px solid rgba(255, 255, 255, 0.2); 
            margin-top: 10px; padding-top: 10px; font-weight: 800; 
            font-size: 1.2rem; color: #ff9500; 
        }

        .result-box { display: none; margin-top: 20px; }
        .line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f2f2f7; }
        .highlight { color: #34c759; font-weight: bold; }
        .info { font-size: 0.75rem; opacity: 0.8; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2 class="salary-title">מחשבון שכר חודשי</h2>
    <div class="input-group">
        <label>שכר ברוטו חודשי (₪):</label>
        <input type="text" id="bruto_display" oninput="handleSalaryInput(this)" placeholder="הכנס שכר" inputmode="numeric">
    </div>

    <div id="salaryResultBox" class="result-box">
        <div class="line"><span>נטו בבנק:</span> <span class="highlight" id="r_neto"></span></div>
        <button class="btn-transfer" onclick="transferToSavings()">➕ העבר נתונים לתחזית חיסכון</button>
        <div class="summary-box">
            <div class="summary-title">סיכום צבירה שנתית</div>
            <div class="s-line"><span>נטו שנתי:</span> <span id="s_neto"></span></div>
            <div class="s-line total-highlight"><span>סה"כ שנתי:</span> <span id="s_yearly_total"></span></div>
        </div>
    </div>
</div>

<div class="card" id="savingsCard">
    <h2 class="savings-title">תחזית חיסכון בפרישה</h2>
    <div class="summary-box">
        <div class="s-line"><span>הון בפרישה:</span> <span id="res_total"></span></div>
        <button class="btn-pension-transfer" onclick="transferToPensionCalc()">💰 העבר לחישוב קצבה</button>
    </div>
</div>

<div class="card" id="pensionCalcCard">
    <h2 class="pension-title">מחשבון קצבה נטו</h2>
    <div id="pensionResultBox" class="summary-box" style="display:none;">
        <div class="s-line total-highlight"><span>קצבה נטו:</span> <span id="netoVal"></span></div>
    </div>
</div>

<script>
    // לוגיקת JavaScript כפי שמופיעה בקוד המקור שלך
    // ... (פונקציות handleSalaryInput, calcSavings, transferToPensionCalc וכו')
</script>
</body>
</html>
